[workspace]
resolver = "3"
members = ["crates/*",
"crates/styro-rhi/examples/*"
]

[workspace.dependencies]
styro-shader-tools = { path = "crates/styro-shader-tools" }
styro-rhi = { path = "crates/styro-rhi" }
styro-rendergraph = { path = "crates/styro-rendergraph" }

# 2026-05-20, required for bindings to Vulkan 1.4 and VK_EXT_descriptor_heap
ash = { git = "https://github.com/ash-rs/ash.git", rev = "a9a1fb17e98a0cde146caada86200d809306200d" }
ash-window = { git = "https://github.com/ash-rs/ash.git", rev = "a9a1fb17e98a0cde146caada86200d809306200d" }
# bytemuck is too useful not to use
bytemuck = { version = "1.25.0", features = ["derive"] }

egui = "0.34.3"
egui-winit = "0.34.3"

image = "0.25.10"

serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

# ash-window does not re-export this, so we need it
raw-window-handle = "0.6.2"

# We also need to modify vk-mem so it uses the latest ash
vk-mem = { git = "https://github.com/cakarsubasi/vk-mem-rs.git" }

winit = "0.30.13"
